{% extends 'base.html' %}
{% block title %}404 – Not Found{% endblock %}
{% block content %}
<div class="sf-error-page">
  <div class="sf-error-code text-primary">404</div>
  <div class="sf-error-title">Page Not Found</div>
  <p class="text-muted">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn sf-btn-primary mt-3">
    <i class="fa-solid fa-house me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
