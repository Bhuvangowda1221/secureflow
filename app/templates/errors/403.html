{% extends 'base.html' %}
{% block title %}403 – Forbidden{% endblock %}
{% block content %}
<div class="sf-error-page">
  <div class="sf-error-code text-warning">403</div>
  <div class="sf-error-title">Access Denied</div>

  <a href="{{ url_for('dashboard.index') }}" class="btn sf-btn-primary mt-3">
    <i class="fa-solid fa-house me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
