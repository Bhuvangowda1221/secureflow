services:
  - type: web
    name: secureflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///secureflow.db
      - key: ADMIN_EMAIL
        value: admin@secureflow.local
      - key: ADMIN_PASSWORD
        value: Admin@SecureFlow1
      - key: PYTHONUNBUFFERED
        value: 1
