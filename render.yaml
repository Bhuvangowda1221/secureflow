services:
  - type: web
    name: secureflow
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./instance/secureflow.db
      - key: ADMIN_EMAIL
        value: admin@secureflow.local
      - key: ADMIN_PASSWORD
        value: Admin@SecureFlow1
      - key: PYTHON_VERSION
        value: 3.11.0
